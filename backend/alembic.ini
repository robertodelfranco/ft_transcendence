# Alembic do backend (rooms.md §2.9): uma pasta, cadeia linear.
# A URL do banco não mora aqui: o alembic/env.py monta a partir das POSTGRES_* (infra.md §2.5).

[alembic]
# %(here)s é esta pasta: os comandos funcionam de qualquer cwd
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# 0001_initial.py, 0002_<slug>.py: a revisão nova sai com --rev-id (backend/README.md)
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
