# Sem container_name: os serviços se acham pelo nome de serviço (infra.md, decisão 7)
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    # -h localhost: na primeira subida o initdb roda num servidor temporário só no
    # socket unix; sem o -h, o pg_isready daria "pronto" antes do restart dele
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - transcendence

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - media:/media # MEDIA_DIR: avatares enviados (infra.md, decisão 13)
    depends_on:
      db:
        condition: service_healthy
    # a imagem slim não tem curl; o urlopen levanta exceção em resposta que não seja 2xx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - transcendence

  frontend:
    build: ./frontend
    networks:
      - transcendence

  proxy:
    build: ./proxy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/certs:/certs-host:ro
      - media:/media:ro # o Nginx serve os avatares sem passar pelo backend
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      # o Nginx resolve "grafana" ao subir; o custo é um Grafana quebrado segurar o proxy (decisão 20)
      grafana:
        condition: service_healthy
    networks:
      - transcendence

  # Monitoring (infra.md §2.6): nenhum publica porta; só a rede interna alcança
  prometheus:
    image: prom/prometheus:v3.13.5 # LTS
    # o command substitui o CMD da imagem, então config e path voltam aqui;
    # o :- cobre um .env sem as chaves de retenção (o do CI, por exemplo)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-500MB}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro # a pasta, para o alerts.yml da F8.10 entrar sem mexer aqui
      - prom_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - transcendence

  # datasource e dashboards vêm dos arquivos; sem volume de dados, o banco interno nasce a cada up:
  # a senha do .env sempre vale e nada criado na UI sobrevive (infra.md, decisão 18).
  # Só as variáveis dele: o env_file entregaria JWT_SECRET e senhas que o Grafana não usa
  grafana:
    image: grafana/grafana:13.2.5
    environment:
      # o :? para o compose com a mensagem: sem ele, admin vazio vira admin/admin (decisão 19)
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?defina GF_SECURITY_ADMIN_USER no .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?defina GF_SECURITY_ADMIN_PASSWORD no .env}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:-localhost}/grafana/ # derivada aqui, não no .env (§2.5)
      # o :- cobre um .env sem as chaves (o do CI) com o valor seguro
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH:-true}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-false}
      # atrás do Nginx o Grafana só vê HTTP: sem isto, o cookie de sessão sai sem Secure
      GF_SECURITY_COOKIE_SECURE: ${GF_SECURITY_COOKIE_SECURE:-true}
      # nenhuma requisição para fora: nada bloqueado no console na rede da 42
      GF_SECURITY_DISABLE_GRAVATAR: ${GF_SECURITY_DISABLE_GRAVATAR:-true}
      GF_ANALYTICS_REPORTING_ENABLED: ${GF_ANALYTICS_REPORTING_ENABLED:-false}
      GF_ANALYTICS_CHECK_FOR_UPDATES: ${GF_ANALYTICS_CHECK_FOR_UPDATES:-false}
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: ${GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES:-false}
      GF_NEWS_NEWS_FEED_ENABLED: ${GF_NEWS_NEWS_FEED_ENABLED:-false}
    # só as duas pastas nossas: montar o provisioning inteiro esconde as pastas plugins/ e
    # alerting/ da imagem, e o Grafana registra um erro por pasta a cada subida
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    # com serve_from_sub_path, o mesmo caminho que o Nginx vai repassar
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/grafana/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - transcendence

  # montagens testadas no Docker rootless da 42 em 17/10 (o mount-points-exclude, só no WSL);
  # nenhum caminho por usuário. Tráfego de rede sai do container, não do host (infra.md §2.6)
  node-exporter:
    image: prom/node-exporter:v1.12.1
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # o padrão da imagem + run/user, que o WSL monta duas vezes (série duplicada a cada scrape);
      # $$ porque o compose interpolaria o $
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|run/user|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - transcendence

  # mesmo usuário do backend (infra.md, decisão 17); a senha separada da URI dispensa URL-encoding
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    networks:
      - transcendence

volumes:
  db_data:
  media:
  prom_data:

networks:
  transcendence:
    driver: bridge
