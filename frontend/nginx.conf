server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos com hash no nome (gerados pelo Vite) nunca mudam
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota que não é arquivo cai no index.html (React Router decide)
    location / {
        try_files $uri /index.html;
    }
}
