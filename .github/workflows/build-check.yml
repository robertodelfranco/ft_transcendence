name: Build check

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs: 
  compose-up:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env <<EOF
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=transcendence
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          PUBLIC_HOST=localhost:8443
          PROXY_HTTP_PORT=8080
          PROXY_HTTPS_PORT=8443
          GF_SECURITY_ADMIN_USER=ci
          GF_SECURITY_ADMIN_PASSWORD=ci-grafana
          EOF
        
      # --wait: espera db e backend ficarem healthy; reprova se algum ficar unhealthy ou sair
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 120
      
      # Sem mkcert no CI: o proxy gera o self-signed (infra.md, decisão 11) e o
      # curl valida contra ele com --cacert, em vez de desligar a checagem com -k
      - name: Wait for proxy -> frontend and proxy -> backend over HTTPS
        run: |
          for i in $(seq 1 30); do
            if docker compose cp proxy:/etc/nginx/certs/cert.pem ci-cert.pem 2>/dev/null \
              && curl -fsS --cacert ci-cert.pem https://localhost:8443/ > /dev/null \
              && curl -fsS --cacert ci-cert.pem https://localhost:8443/api/health > /dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for stack"
          exit 1
        
      - name: HTTP redirects to HTTPS keeping the port
        run: |
          got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8080/api/health)
          echo "$got"
          test "$got" = "301 https://localhost:8443/api/health"

      - name: Check database
        run: docker compose exec -T db pg_isready -U ci -d transcendence

      # F8.9: datasource e os 3 dashboards vêm só dos arquivos, sem nada feito na UI
      # (o Grafana não publica porta: a consulta roda de dentro do container)
      - name: Grafana provisioned
        run: |
          api=http://ci:ci-grafana@localhost:3000/grafana/api
          search=$(docker compose exec -T grafana wget -qO- "$api/search?type=dash-db")
          for uid in catacombs-game catacombs-host catacombs-postgres; do
            echo "$search" | grep -q "\"uid\":\"$uid\"" || { echo "missing dashboard $uid"; exit 1; }
          done
          docker compose exec -T grafana wget -qO- "$api/datasources/uid/prometheus/health" | grep -q '"status":"OK"'

      - name: No container exited
        run: test -z "$(docker compose ps -a -q --status exited)"
      
      - name: Show containers
        if: always()
        run: docker compose ps -a
      
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

  # Roda em paralelo com o compose-up: os testes do backend não precisam da stack,
  # só de um Postgres, que vem como service (sem ele, os testes de banco reprovam no CI)
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: transcendence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d transcendence"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: transcendence
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A migração sobe do zero, e os modelos batem com ela (rooms.md §4, decisão 4)
      - name: Alembic upgrade and check
        run: |
          alembic upgrade head
          alembic check

      - name: Run pytest
        # teste de tempo fica fora: runner compartilhado faz ele falhar ao acaso
        run: pytest -m "not perf"

  # Roda em paralelo com os outros: lint, vitest e build não precisam da stack
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run vitest
        run: npm test

      - name: Build
        run: npm run build
