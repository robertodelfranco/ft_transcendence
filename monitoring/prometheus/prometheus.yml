# Targets pelo nome de serviço na rede transcendence (infra.md §2.6); nenhum sai para o host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# pelo nome, sem glob: o alerts.test.yml da mesma pasta é do promtool, não regra (F8.10)
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: backend # /metrics fora do /api, que o Nginx não roteia (F8.7)
    static_configs:
      - targets: ["backend:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
