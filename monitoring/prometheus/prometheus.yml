# Targets pelo nome de serviço na rede transcendence (infra.md §2.6); nenhum sai para o host.
# rule_files entra com o alerts.yml da F8.10.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend # /metrics fora do /api, que o Nginx não roteia (F8.7)
    static_configs:
      - targets: ["backend:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
